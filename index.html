<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Let's calculate!</title>
</head>

<body>
    <div id="body-wrap">

        <div id="display">Example: 114+514</div>
        <div id="operator-input" class="button-list">
            <button>+</button>
            <button>-</button>
            <button>*</button>
            <button>/</button>
        </div>
        <div id="action" class="button-list">
            <button id="equal-button">=</button>
            <button id="clear-button">Clear</button>
        </div>
        <div id="num-input" class="button-list">
            <button>0</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button id="dot-button">.</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
